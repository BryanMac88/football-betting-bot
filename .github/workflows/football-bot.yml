name: Football Bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 9 * * *"

jobs:
  run-football-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (football)
        run: |
          python -m pip install --upgrade pip
          if [ -f football_bot/football_bot/requirements_football.txt ]; then
            pip install -r football_bot/football_bot/requirements_football.txt
          elif [ -f football_bot/requirements_football.txt ]; then
            pip install -r football_bot/requirements_football.txt
          else
            echo "No requirements_football.txt found" && exit 1
          fi

      - name: Run football bot
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python football_bot/football_bot/run_football_bot.py
