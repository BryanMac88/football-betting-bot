name: Football Betting Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily

concurrency:
  group: football-betting-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # Bot settings (prefer repo Variables, fallback defaults here)
      RISK_PROFILE: ${{ vars.RISK_PROFILE }}
      BANKROLL_EUR: ${{ vars.BANKROLL_EUR }}
      TAB_SUFFIX: ${{ vars.TAB_SUFFIX }}
      CLEANUP_MODE: ${{ vars.CLEANUP_MODE }}
      PROTECT_TABS: ${{ vars.PROTECT_TABS }}
      STRICT_SCHEMA: ${{ vars.STRICT_SCHEMA }}
      MAX_BEST_PER_GAME: ${{ vars.MAX_BEST_PER_GAME }}

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model
        run: |
          python football_bot/football_bot/run_football_model.py
