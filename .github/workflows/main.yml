name: Football Betting Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # Config defaults (you can change these later via repo secrets if you want)
      REGION: uk
      BANKROLL: "100"
      KELLY_FRACTION: "0.25"
      MIN_EDGE: "0.03"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets and environment
        run: |
          python - << 'PY'
          import os, json, sys

          required = ["ODDS_API_KEY", "SHEET_ID", "GOOGLE_SERVICE_ACCOUNT_JSON"]
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              print("❌ Missing required GitHub secrets:", missing)
              print("Go to: Repo → Settings → Secrets and variables → Actions")
              sys.exit(1)

          # Validate that the Google JSON secret is valid JSON
          try:
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          except Exception as e:
              print("❌ GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON:", e)
              sys.exit(1)

          # Optional config sanity checks
          for k in ["REGION", "BANKROLL", "KELLY_FRACTION", "MIN_EDGE"]:
              if not os.getenv(k):
                  print(f"❌ Missing env var {k} (should be set in workflow env)")
                  sys.exit(1)

          print("✅ Secrets and env look OK")
          PY

      - name: Verify src package structure
        shell: bash
        run: |
          set -e
          echo "Top-level files:"
          ls -la

          if [ ! -d "src" ]; then
            echo "❌ No src/ directory found."
            exit 1
          fi

          echo "src contents:"
          ls -la src

          if [ ! -f "src/__init__.py" ]; then
            echo "❌ src/__init__.py missing. This is required for python -m src.main."
            echo "But you said it already exists—if not, create it as an empty file."
            exit 1
          fi

          if [ ! -f "src/main.py" ]; then
            echo "❌ src/main.py not found."
            echo "These are the python files in src:"
            find src -maxdepth 3 -type f -name "*.py" -print
            exit 1
          fi

          echo "✅ src package looks OK"

      - name: Run betting bot
        run: |
          python -m src.main
