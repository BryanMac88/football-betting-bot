name: Football Betting Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      REGION: uk
      BANKROLL: "100"
      KELLY_FRACTION: "0.25"
      MIN_EDGE: "0.03"

      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "DEBUG"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show repo structure
        shell: bash
        run: |
          set -e
          echo "Top level:"
          ls -la
          echo ""
          echo "src:"
          ls -la src || true
          echo ""
          echo "Python files under src (max depth 3):"
          find src -maxdepth 3 -type f -name "*.py" -print || true
          echo ""
          echo "First 120 lines of src/main.py (if present):"
          if [ -f src/main.py ]; then
            nl -ba src/main.py | sed -n '1,120p'
          else
            echo "src/main.py not found"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -V
          pip -V

      - name: Validate secrets (won't print secrets)
        run: |
          python - << 'PY'
          import os, json, sys
          required = ["ODDS_API_KEY", "SHEET_ID", "GOOGLE_SERVICE_ACCOUNT_JSON"]
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              print("❌ Missing required GitHub secrets:", missing)
              sys.exit(1)
          json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          print("✅ Secrets present and Google JSON parses.")
          print("SHEET_ID length:", len(os.environ["SHEET_ID"]))
          print("REGION:", os.environ.get("REGION"))
          PY

      - name: Run betting bot (capture output and REAL exit code)
        shell: bash
        run: |
          set -euo pipefail
          echo "Running: python -X faulthandler -m src.main"
          python -X faulthandler -m src.main 2>&1 | tee run_output.log
          echo "✅ Python finished OK"

      - name: Show run output file size and last lines
        if: always()
        shell: bash
        run: |
          echo "===== run_output.log file info ====="
          ls -la run_output.log || true
          echo ""
          echo "===== LAST 200 LINES (run_output.log) ====="
          tail -n 200 run_output.log || true

      - name: Upload run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run_output
          path: run_output.log
