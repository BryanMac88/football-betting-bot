name: Football Betting Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      REGION: uk
      BANKROLL: "100"
      KELLY_FRACTION: "0.25"
      MIN_EDGE: "0.03"

      # Make sure prints show up immediately in GitHub Actions logs
      PYTHONUNBUFFERED: "1"

      # Many projects use LOG_LEVEL if implemented
      LOG_LEVEL: "DEBUG"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show repo structure
        shell: bash
        run: |
          set -e
          echo "Top level:"
          ls -la
          echo ""
          echo "src:"
          ls -la src || true
          echo ""
          echo "Python files under src (max depth 3):"
          find src -maxdepth 3 -type f -name "*.py" -print || true
          echo ""
          echo "requirements.txt:"
          cat requirements.txt || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets (won't print secrets)
        run: |
          python - << 'PY'
          import os, json, sys
          required = ["ODDS_API_KEY", "SHEET_ID", "GOOGLE_SERVICE_ACCOUNT_JSON"]
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              print("❌ Missing required GitHub secrets:", missing)
              sys.exit(1)

          try:
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          except Exception as e:
              print("❌ GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON:", e)
              sys.exit(1)

          print("✅ Secrets present and Google JSON parses.")
          PY

      - name: Run betting bot (with captured output)
        shell: bash
        run: |
          set -e
          echo "Running: python -m src.main"
          python -m src.main 2>&1 | tee run_output.log

      - name: Show last 200 lines of run output
        if: always()
        run: |
          echo "===== LAST 200 LINES (run_output.log) ====="
          tail -n 200 run_output.log || true

      - name: Upload run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run_output
          path: run_output.log
