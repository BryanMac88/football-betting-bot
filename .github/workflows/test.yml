name: Test football bot

on:
  workflow_dispatch:
  # Optional daily run at 10:00 UTC
  # schedule:
  #   - cron: "0 10 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      REGION: uk
      BANKROLL: "100"
      KELLY_FRACTION: "0.25"
      MIN_EDGE: "0.03"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Sanity check secrets exist
        run: |
          python - << 'PY'
          import os, sys, json
          missing = [k for k in ["ODDS_API_KEY","SHEET_ID","GOOGLE_SERVICE_ACCOUNT_JSON"] if not os.getenv(k)]
          if missing:
            print("Missing secrets:", missing)
            sys.exit(1)
          # validate JSON parses
          json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          print("Secrets look good.")
          PY

      - name: Run bot
        run: |
          # Try common entrypoints; keep the one that matches your repo
          if [ -f main.py ]; then python main.py; \
          elif [ -f run.py ]; then python run.py; \
          elif [ -f update.py ]; then python update.py; \
          else echo "No entrypoint found (main.py/run.py/update.py)."; ls -la; exit 1; fi
